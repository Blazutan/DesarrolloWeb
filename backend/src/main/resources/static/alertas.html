<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pedidos listos | PoliRestaurante</title>
    <style>
        :root {
            --ink: #18302d;
            --muted: #61716e;
            --paper: #f4f6f1;
            --surface: #fff;
            --line: #d7dfd9;
            --green: #176a50;
            --green-dark: #104b3c;
            --coral: #b3422e;
            --amber: #e6b84f;
        }

        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; color: var(--ink); background: var(--paper); font-family: Georgia, "Times New Roman", serif; }
        header { display: flex; justify-content: space-between; padding: 18px max(24px, calc((100vw - 760px) / 2)); color: #f8f6ed; background: var(--green-dark); font: 700 0.9rem "Trebuchet MS", sans-serif; }
        header span + span { color: #c8d8ce; font-weight: 400; }
        main { width: min(100% - 32px, 760px); margin: 48px auto; }
        .eyebrow { margin: 0 0 8px; color: var(--green); font: 700 0.8rem "Trebuchet MS", sans-serif; text-transform: uppercase; }
        h1 { margin: 0; font-size: clamp(2rem, 5vw, 3rem); }
        .intro { margin: 10px 0 26px; color: var(--muted); font: 1rem/1.5 "Trebuchet MS", sans-serif; }
        .login, .alert { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
        .login { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; padding: 16px; }
        label { display: grid; gap: 6px; color: var(--muted); font: 0.78rem "Trebuchet MS", sans-serif; }
        input { width: 100%; min-height: 42px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 4px; color: var(--ink); background: #fff; font: 1rem "Trebuchet MS", sans-serif; }
        button { min-height: 42px; align-self: end; padding: 0 16px; border: 0; border-radius: 4px; color: #fff; background: var(--green); cursor: pointer; font: 700 0.9rem "Trebuchet MS", sans-serif; }
        button:hover { background: var(--green-dark); }
        button:focus-visible, input:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin: 28px 0 12px; }
        .toolbar h2 { margin: 0; font-size: 1.25rem; }
        .toolbar button { min-height: 36px; color: var(--green-dark); background: transparent; border: 1px solid var(--line); }
        .toolbar button:hover { background: #e6ede7; }
        .status { min-height: 24px; margin: 12px 0; color: var(--muted); font: 0.9rem "Trebuchet MS", sans-serif; }
        .alerts { display: grid; gap: 10px; }
        .alert { display: grid; grid-template-columns: 8px 1fr auto; align-items: center; gap: 14px; padding: 16px; animation: arrive 240ms ease-out both; }
        .signal { width: 8px; height: 42px; border-radius: 4px; background: var(--coral); }
        .alert h3 { margin: 0 0 5px; font-size: 1.08rem; }
        .alert p { margin: 0; color: var(--muted); font: 0.88rem "Trebuchet MS", sans-serif; }
        .count { margin-top: 6px !important; color: var(--coral) !important; font-weight: 700 !important; }
        .empty { padding: 20px 0; color: var(--muted); font: 0.95rem "Trebuchet MS", sans-serif; }
        [hidden] { display: none !important; }
        @keyframes arrive { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 620px) {
            header { padding: 16px; }
            main { margin: 34px auto; }
            .login { grid-template-columns: 1fr; }
            .login button, .alert button { width: 100%; }
            .alert { grid-template-columns: 6px 1fr; }
            .alert button { grid-column: 2; }
        }
    </style>
</head>
<body>
    <header><span>POLIRESTAURANTE</span><span>PANEL DE MESERO</span></header>
    <main>
        <p class="eyebrow">Servicio en curso</p>
        <h1>Pedidos listos</h1>
        <p class="intro">Avisos de cocina para tus pedidos pendientes de recoger.</p>
        <form id="login" class="login">
            <label>Correo<input id="correo" type="email" autocomplete="username" required></label>
            <label>Contraseña<input id="password" type="password" autocomplete="current-password" required></label>
            <button type="submit">Iniciar sesión</button>
        </form>
        <div class="toolbar" id="toolbar" hidden>
            <h2>Por recibir</h2>
            <button type="button" id="logout">Cerrar sesión</button>
        </div>
        <p class="status" id="status" role="status" aria-live="polite">Inicia sesión para ver tus avisos.</p>
        <section class="alerts" id="alerts" aria-label="Alertas de pedidos" aria-live="polite"></section>
    </main>
    <script>
        const loginForm = document.querySelector("#login");
        const statusText = document.querySelector("#status");
        const alertList = document.querySelector("#alerts");
        const toolbar = document.querySelector("#toolbar");
        let authorization = "";
        let polling = null;

        function encodeCredentials(value) {
            const bytes = new TextEncoder().encode(value);
            return btoa(Array.from(bytes, byte => String.fromCharCode(byte)).join(""));
        }

        function renderAlerts(alerts) {
            alertList.replaceChildren();
            if (alerts.length === 0) {
                const empty = document.createElement("p");
                empty.className = "empty";
                empty.textContent = "No tienes pedidos listos por recoger.";
                alertList.append(empty);
                return;
            }
            for (const alert of alerts) {
                const item = document.createElement("article");
                item.className = "alert";
                const signal = document.createElement("span");
                signal.className = "signal";
                signal.setAttribute("aria-hidden", "true");
                const content = document.createElement("div");
                const title = document.createElement("h3");
                title.textContent = `Pedido #${alert.pedidoId} listo`;
                const time = document.createElement("p");
                time.textContent = `Listo: ${new Date(alert.fechaListo).toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" })}`;
                const count = document.createElement("p");
                count.className = "count";
                count.textContent = `Aviso ${alert.numeroRecordatorios} de 3`;
                content.append(title, time, count);
                const acknowledge = document.createElement("button");
                acknowledge.type = "button";
                acknowledge.textContent = "Recibido";
                acknowledge.addEventListener("click", () => acknowledgeAlert(alert.pedidoId));
                item.append(signal, content, acknowledge);
                alertList.append(item);
            }
        }

        async function loadAlerts() {
            try {
                const response = await fetch("/api/pedidos/alertas", { headers: { Authorization: authorization } });
                if (!response.ok) {
                    statusText.textContent = response.status === 401 || response.status === 403
                        ? "No fue posible autenticar esta cuenta de mesero."
                        : "No se pudieron cargar los avisos.";
                    return false;
                }
                renderAlerts(await response.json());
                statusText.textContent = "Avisos actualizados automáticamente.";
                return true;
            } catch {
                statusText.textContent = "No hay conexión con el servidor.";
                return false;
            }
        }

        async function acknowledgeAlert(pedidoId) {
            const response = await fetch(`/api/pedidos/${pedidoId}/recibido`, {
                method: "PATCH",
                headers: { Authorization: authorization }
            });
            if (response.ok) await loadAlerts();
            else statusText.textContent = "No se pudo confirmar el aviso.";
        }

        loginForm.addEventListener("submit", async event => {
            event.preventDefault();
            const correo = document.querySelector("#correo").value.trim();
            const password = document.querySelector("#password").value;
            authorization = `Basic ${encodeCredentials(`${correo}:${password}`)}`;
            if (await loadAlerts()) {
                loginForm.hidden = true;
                toolbar.hidden = false;
                document.querySelector("#password").value = "";
                polling = window.setInterval(loadAlerts, 5000);
            } else authorization = "";
        });

        document.querySelector("#logout").addEventListener("click", () => {
            window.clearInterval(polling);
            polling = null;
            authorization = "";
            loginForm.hidden = false;
            toolbar.hidden = true;
            alertList.replaceChildren();
            statusText.textContent = "Sesión cerrada.";
        });
    </script>
</body>
</html>
